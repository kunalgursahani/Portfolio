<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Write a post — Kunal Gursahani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
  .admin-wrap{ max-width: 720px; margin: 0 auto; padding: 140px 24px 80px; }
  .admin-card{
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 30px; margin-bottom: 22px;
  }
  .admin-card input, .admin-card textarea{
    width: 100%; background: var(--bg-panel-2); border: 1px solid var(--border-strong);
    border-radius: 10px; color: var(--text-primary); padding: 12px 14px;
    font-family: var(--font-body); font-size: 14px; margin-bottom: 14px;
  }
  .admin-card textarea{ min-height: 90px; resize: vertical; }
  .admin-post-row{
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--border);
  }
  .admin-post-row:last-child{ border-bottom: none; }
  .btn-danger{
    border: 1px solid rgba(255,90,90,0.4); color: #ff8a8a;
    padding: 6px 14px; border-radius: 100px; font-size: 12.5px; background: none;
    font-family: var(--font-body); cursor: pointer;
  }
  .btn-danger:hover{ background: rgba(255,90,90,0.1); }
  #authStatus{ margin-bottom: 20px; color: var(--text-muted); font-size: 14px; }
  #publishBtn, #signInBtn{ border: none; cursor: pointer; font-family: var(--font-body); }
</style>
</head>
<body>

<div class="grain"></div>

<header class="nav">
  <a href="index.html" class="nav-mark">
    <span class="mark-core"></span>
    <span class="mark-text">KG</span>
  </a>
  <span class="nav-cta" id="signOutBtn" style="cursor:pointer; display:none;">Sign out</span>
</header>

<main class="admin-wrap">
  <p class="eyebrow eyebrow-alt"><span class="eyebrow-dot"></span> ADMIN</p>
  <h1 class="section-title" style="margin-bottom:24px;">Write a post</h1>

  <p id="authStatus">Checking sign-in…</p>

  <div id="signInBox" class="admin-card" style="display:none; text-align:center;">
    <p style="margin-bottom:18px; color:var(--text-muted);">Sign in with your Google account to publish.</p>
    <button id="signInBtn" class="btn btn-primary">Sign in with Google</button>
  </div>

  <div id="composer" class="admin-card" style="display:none;">
    <input id="postTitle" placeholder="Title" />
    <input id="postTag" placeholder="Tag (e.g. RAP, Fiori, Clean Core)" />
    <input id="postUrl" placeholder="Link to the full post (Medium, LinkedIn article, your blog…)" />
    <textarea id="postExcerpt" placeholder="Short excerpt — one or two lines"></textarea>
    <button id="publishBtn" class="btn btn-primary">Publish</button>
    <span id="publishMsg" style="margin-left:12px; font-size:13px; color:var(--text-faint);"></span>
  </div>

  <div id="postsList" class="admin-card" style="display:none;">
    <h3 style="margin-bottom:16px; font-family:var(--font-display); font-size:17px;">Published posts</h3>
    <div id="postsListInner"></div>
  </div>
</main>

<script type="module" src="admin.js"></script>
</body>
</html>
